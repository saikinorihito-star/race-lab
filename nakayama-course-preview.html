<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Race Lab | 中山芝A コース検証</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101f26;color:#eef6f4}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}p{line-height:1.6;font-size:13px;color:#b4c9c6}a{color:#b9e8de}button,select,input{font:inherit}button,select{color:#f2ffff;background:#274653;border:1px solid #71959b;border-radius:8px;min-height:44px;padding:8px 12px}button.primary{background:#bde975;color:#14251b;font-weight:bold}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.stage{position:relative;height:min(62vh,680px);min-height:310px;border:1px solid #537c80;border-radius:12px;overflow:hidden;background:#9ac4dd}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.stage .hud{position:absolute;left:10px;top:10px;background:#10232fe8;color:white;border-radius:8px;padding:8px;font-size:13px;pointer-events:none}.stage .error{position:absolute;inset:15px;background:#142c37;padding:15px;border-radius:8px} .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.metric{border:1px solid #36535a;border-radius:9px;background:#172c36;padding:10px}.metric span{display:block;font-size:11px;color:#b2cac7}.metric strong{display:block;font-size:18px;margin-top:5px;font-variant-numeric:tabular-nums}#profile{width:100%;height:160px;background:#142b35;border-radius:8px;margin-top:10px}#progress{width:100%;min-height:34px}small{color:#b4c9c6}details{margin-top:12px;border:1px solid #36535a;border-radius:9px;padding:12px}summary{cursor:pointer} @media(max-width:500px){main{padding:8px}.stage{height:48vh;min-height:300px}h1{font-size:18px}.controls{gap:5px}button,select{padding:8px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.173.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/"}}</script></head>
<body><main><header><h1>中山競馬場｜芝Aコース</h1><a href="./tokyo-turf-a-elevation-rebuild.html?relief=3&amp;model=design01&amp;group=18">東京・既存レースへ戻る</a></header>
<p>第1段階：コース形状・スタート位置・高低差の検証版。馬の能力計算や18頭の競走はまだ接続していません。</p>
<div class="controls"><label>距離 <select id="distance"></select></label><button id="overhead">全体・上空</button><button id="angle">斜め全景</button><button id="follow">走路追尾</button><label>坂の表示 <select id="relief"><option value="1">実寸</option><option value="3" selected>3倍（確認用）</option></select></label></div>
<div id="stage" class="stage"><div class="hud" id="hud">読み込み中</div></div>
<div class="controls"><button id="play" class="primary">走路確認スタート</button><button id="reset">発走地点へ</button><label>速度 <select id="speed"><option value="1">1倍</option><option value="2">2倍</option><option value="4" selected>4倍</option><option value="8">8倍</option></select></label><small>青い点は走路確認用の位置マーカーです。</small></div>
<label>走行位置 <input id="progress" type="range" min="0" max="2500" value="0" step="1"></label>
<div class="metrics"><div class="metric"><span>コース</span><strong id="type">—</strong></div><div class="metric"><span>残り距離</span><strong id="remain">—</strong></div><div class="metric"><span>相対高度（近似）</span><strong id="alt">—</strong></div><div class="metric"><span>勾配（近似）</span><strong id="grade">—</strong></div></div>
<canvas id="profile" aria-label="距離別高低断面図"></canvas>
<details><summary>コースの仕様・出典</summary><p>右回り、内1667.1m／外1839.7m、直線310m、全体高低差5.3m、残り180〜70mの急坂2.2m・最大勾配2.24%。平面座標、分岐点の距離、幅員分布、各坂の細部は公式図から推定した再構築値。ポケットは仮形状。仮柵B/C、ダート競走、障害競走は対象外です。</p><p><a href="https://www.jra.go.jp/facilities/race/nakayama/course/" target="_blank" rel="noopener">JRA公式 中山競馬場コース紹介</a></p></details>
</main><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {SPEC,DISTANCES,ROUTE_LABELS,LOOPS,at,widthAt,makeRoute,routeAt,gradeAt} from './nakayama-course.mjs';
const $=id=>document.getElementById(id),stage=$('stage');
for(const d of DISTANCES)$('distance').add(new Option(d+'m（'+ROUTE_LABELS[d]+'）',d));
$('distance').value='2500';
let route=makeRoute(2500),travel=0,playing=false,mode='angle',relief=3;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa6cddd);scene.fog=new THREE.Fog(0xa6cddd,1200,2700);
const camera=new THREE.PerspectiveCamera(48,1,.5,4000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));stage.prepend(renderer.domElement);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI*.48;orbit.minDistance=25;orbit.maxDistance=2000;
scene.add(new THREE.HemisphereLight(0xe7f7ff,0x5b744a,2.2));const sun=new THREE.DirectionalLight(0xfff4d5,2);sun.position.set(-300,550,300);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,1800),new THREE.MeshStandardMaterial({color:0x59854b}));ground.rotation.x=-Math.PI/2;ground.position.set(30,-15,-120);scene.add(ground);
const course=new THREE.Group(),marks=new THREE.Group();scene.add(course,marks);
const grass=new THREE.MeshStandardMaterial({color:0x419e41,roughness:.94,side:THREE.DoubleSide}),outerGrass=new THREE.MeshStandardMaterial({color:0x4ba749,roughness:.94,side:THREE.DoubleSide}),rail=new THREE.LineBasicMaterial({color:0xffffff}),routeMat=new THREE.LineBasicMaterial({color:0xffe15c}),baseMat=new THREE.MeshStandardMaterial({color:0x49763f,side:THREE.DoubleSide});
const marker=new THREE.Mesh(new THREE.SphereGeometry(3.1,14,10),new THREE.MeshStandardMaterial({color:0x2398f4,emissive:0x0b3860}));scene.add(marker);
function xyz(p,lateral=0,lift=0){return new THREE.Vector3(p.x-p.tz*lateral,p.y*relief+lift,p.z+p.tx*lateral)}
function dispose(g){for(const obj of [...g.children]){g.remove(obj);obj.geometry?.dispose();if(obj.material?.map){obj.material.map.dispose();obj.material.dispose()}}}
function meshStrip(points,material,edgeHeight=null){
 const vertices=[],index=[];
 for(let i=0;i<points.length;i++){
  const p=points[i],w=p.width;
  const l=xyz(p,1,.04),r=xyz(p,1-w,.04);
  vertices.push(l.x,l.y,l.z,r.x,r.y,r.z);
  if(i){const j=(i-1)*2;index.push(j,j+1,j+2,j+1,j+3,j+2)}
 }
 const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geom.setIndex(index);geom.computeVertexNormals();course.add(new THREE.Mesh(geom,material));
}
function drawRail(points,side){const vs=points.map(p=>xyz(p,side===0?1:1-p.width,1.1));course.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(vs),rail))}
function loopPoints(kind,start,end){const count=Math.ceil((end-start)/3);return Array.from({length:count+1},(_,i)=>{const s=start+(end-start)*i/count,p=at(kind,s);return {...p,width:widthAt(kind,s)}})}
function label(text,p,color){
 const cvs=document.createElement('canvas');cvs.width=256;cvs.height=96;const c=cvs.getContext('2d');c.fillStyle=color;c.fillRect(5,5,246,86);c.fillStyle='#fff';c.font='bold 48px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(text,128,48);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cvs),depthTest:false}));sprite.position.copy(xyz(p,0,12));sprite.scale.set(29,11,1);marks.add(sprite);
}
function stripe(p,material){const w=p.width||widthAt(p.kind,p.station),v=[xyz(p,1,.16),xyz(p,1-w,.16)];marks.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(v),material))}
function rebuild(){
 dispose(course);dispose(marks);
 // Shared section is drawn once, then only the outer branch between splits.
 const inner=loopPoints('inner',0,SPEC.innerLap);meshStrip(inner,grass);
 const outer=loopPoints('outer',517.1,1239.7);meshStrip(outer,outerGrass);
 // Break rails near divergence/rejoin to avoid a barrier across the branch.
 const parts=[loopPoints('inner',0,493),loopPoints('inner',545,1040),loopPoints('inner',1095,SPEC.innerLap)];
 for(const p of parts){drawRail(p,0);drawRail(p,1)}
 const o=loopPoints('outer',545,1210);drawRail(o,0);drawRail(o,1);
 if(route.legs[0].kind==='pocket'){
  const length=route.legs[0].length,pts=Array.from({length:51},(_,i)=>routeAt(route,length*i/50));
  meshStrip(pts,outerGrass);drawRail(pts.slice(0,40),0);drawRail(pts.slice(0,40),1);
 }
 const n=Math.ceil(route.distance/3);
 const path=Array.from({length:n+1},(_,i)=>{const p=routeAt(route,route.distance*i/n);return xyz(p,1-p.width/2,.22)});
 marks.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(path),routeMat));
 const start=routeAt(route,0),goal=routeAt(route,route.distance);stripe(start,rail);stripe(goal,rail);label('S',start,'#245c82');label('G',goal,'#9f3b32');
 for(const d of [200,400,600]){const p=routeAt(route,route.distance-d);label(String(d),p,'#3c584a')}
 // Approximate grandstand, independent of Tokyo's building geometry.
 const stand=new THREE.Mesh(new THREE.BoxGeometry(210,14,33),baseMat);stand.position.set(50,1,52);course.add(stand);
 for(let i=0;i<5;i++){const step=new THREE.Mesh(new THREE.BoxGeometry(200,2.2,5),baseMat);step.position.set(50,2+i*2.2,35+i*5);course.add(step)}
}
function setView(which){mode=which;if(which==='overhead'){camera.position.set(20,1000,-159.8);camera.up.set(0,1,0);orbit.target.set(20,0,-160)}else if(which==='angle'){camera.up.set(0,1,0);camera.position.set(590,500,510);orbit.target.set(20,0,-130)}else camera.up.set(0,1,0);orbit.enabled=which!=='follow';orbit.update()}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
function profile(){
 const canvas=$('profile'),dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);
 const left=36,right=w-12,top=12,bottom=h-24,x=d=>left+(right-left)*d/route.distance,y=a=>bottom-(a+3)/6*(bottom-top);
 c.font='11px sans-serif';c.fillStyle='#bfd6d2';c.strokeStyle='#36565d';
 for(const a of [-2,0,2]){c.beginPath();c.moveTo(left,y(a));c.lineTo(right,y(a));c.stroke();c.fillText(a+'m',2,y(a)+4)}
 c.beginPath();for(let i=0;i<=450;i++){const d=route.distance*i/450,p=routeAt(route,d);if(!i)c.moveTo(x(d),y(p.y));else c.lineTo(x(d),y(p.y))}c.strokeStyle='#7bdd9a';c.lineWidth=2;c.stroke();c.lineWidth=1;
 c.fillStyle='#bfd6d2';c.fillText('S',left,h-6);c.fillText('G',right-8,h-6);c.fillStyle='#ffe15c';c.beginPath();c.arc(x(travel),y(routeAt(route,travel).y),4,0,Math.PI*2);c.fill();
}
function update(){
 const p=routeAt(route,travel);marker.position.copy(xyz(p,1-p.width/2,2.8));
 $('type').textContent=p.kind==='pocket'?'ポケット':p.kind==='inner'?'内回り':'外回り';$('remain').textContent=Math.round(route.distance-travel)+'m';$('alt').textContent=p.y.toFixed(2)+'m';$('grade').textContent=gradeAt(route,travel).toFixed(2)+'%';
 $('progress').value=String(Math.round(travel));$('hud').textContent='中山 芝A '+route.distance+'m｜右回り｜'+route.label;
 if(mode==='follow'){const target=marker.position.clone();camera.position.lerp(target.clone().add(new THREE.Vector3(-p.tx*42,20,-p.tz*42)),.12);camera.lookAt(target.clone().add(new THREE.Vector3(p.tx*16,0,p.tz*16)))}
 profile();
}
function reset(){travel=0;playing=false;$('play').textContent='走路確認スタート';update()}
$('distance').onchange=()=>{route=makeRoute(Number($('distance').value));$('progress').max=route.distance;rebuild();reset()};
$('relief').onchange=()=>{relief=Number($('relief').value);rebuild();update()};
$('overhead').onclick=()=>setView('overhead');$('angle').onclick=()=>setView('angle');$('follow').onclick=()=>setView('follow');
$('play').onclick=()=>{if(travel>=route.distance)travel=0;playing=!playing;$('play').textContent=playing?'一時停止':'走路確認スタート'};
$('reset').onclick=reset;$('progress').oninput=()=>{travel=Number($('progress').value);playing=false;$('play').textContent='走路確認スタート';update()};
let last=performance.now(),lastPaint=0;function animate(t){const dt=Math.min(.15,(t-last)/1000);last=t;if(playing){travel=Math.min(route.distance,travel+dt*16*Number($('speed').value));if(travel>=route.distance){playing=false;$('play').textContent='再スタート'}if(t-lastPaint>=50){update();lastPaint=t}}if(orbit.enabled)orbit.update();renderer.render(scene,camera);requestAnimationFrame(animate)}
rebuild();setView('angle');reset();requestAnimationFrame(animate);
</script></body></html>
