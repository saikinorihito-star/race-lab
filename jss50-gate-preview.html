const venueSelect=document.getElementById('venue'),board=document.getElementById('board');
const param=(new URLSearchParams(location.search).get('venue')||'').trim().toLowerCase();
venueSelect.value=Array.from(venueSelect.options).find(o=>o.value===param||o.textContent===param||o.textContent+'競馬場'===param||o.value+' racecourse'===param)?.value||'nakayama';

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id),stage=$('stage');
try{
 const root=await loadApprovedGate(new GLTFLoader()),ctl=createGateVenueController(THREE,root);
 const scene=new THREE.Scene();scene.background=new THREE.Color(0xc4dce5);scene.add(root,new THREE.HemisphereLight(0xffffff,0x69705b,2.3));
 const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(3,7,8);scene.add(sun);

 const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.7,0);orbit.enableDamping=true;
 function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}
 function view(x,y,z){const f=Math.max(1,1.1/camera.aspect);camera.position.set(x*f,y*f,z*f);orbit.update()}
 resize();new ResizeObserver(resize).observe(stage);view(10,6,13);
 const select=$('venue');ctl.setVenue(select.value);select.addEventListener('change',()=>ctl.setVenue(select.value));
 $('front').onclick=()=>view(0,3.8,16);$('rear').onclick=()=>view(0,3.8,-16);$('side').onclick=()=>view(11,3.8,0);$('angle').onclick=()=>view(10,6,13);
 let front=false,back=false,a=0,b=0;$('open').onclick=()=>front=!front;$('back').onclick=()=>back=!back;$('reset').onclick=()=>{front=back=false};

 renderer.render(scene,camera);$('fallback').hidden=true;for(const el of document.querySelectorAll('button'))el.disabled=false;$('status').textContent='3D読込完了｜競馬場名は正面・背面に反映｜可動扉32枚';requestAnimationFrame(tick);
