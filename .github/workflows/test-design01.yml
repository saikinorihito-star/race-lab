name: Smoke test live Design 01 3D GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'three-view.mjs'
      - 'design01-loader.mjs'
      - 'index.html'
      - '.github/workflows/test-design01.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - name: Browser smoke test - actual GLB loaded
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/racelab-server.log 2>&1 &
          node scripts/test-design01.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design01-screenshot
          path: design01-smoke.png
